    <text x="0" y="-28" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="32" letter-spacing="4" fill="white" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Arial Black&quot;, Arial, sans-serif;font-size:32px;font-weight:900;text-anchor:middle;dominant-baseline:auto">IRON</text>

